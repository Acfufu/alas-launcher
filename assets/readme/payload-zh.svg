<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img">
  <title>ALAS 启动器 — 目录结构</title>
  <desc>ALAS 启动器在 Windows、macOS 和 Linux 上的目录结构图。每个平台列展示 ALAS 根目录、启动器可执行文件、Python toolkit、Git 安装路径和 Adb 路径。底部区域对比 Unix 与 Windows 的环境变量 PATH 和 LD_LIBRARY_PATH 差异。</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#13111C"/>
    </linearGradient>
    <linearGradient id="col-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15131F"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="rail-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B21B6"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="dot-pattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#1F2937" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="560" fill="url(#bg-grad)"/>
  <rect width="1200" height="560" fill="url(#dot-pattern)"/>
  <rect x="0.5" y="0.5" width="1199" height="559" fill="none" stroke="#1F2937" stroke-width="1"/>

  <!-- Title -->
  <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="600" y="32" font-size="20" font-weight="bold" fill="#F3F4F6" text-anchor="middle">ALAS 启动器 — 目录结构</text>
  <line x1="450" y1="44" x2="750" y2="44" stroke="url(#rail-grad)" stroke-width="1" opacity="0.4"/>

  <!-- ============ Platform columns ============ -->

  <!-- Column headers -->
  <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="200" y="68" font-size="15" font-weight="bold" fill="#A78BFA" text-anchor="middle">Windows</text>
  <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="600" y="68" font-size="15" font-weight="bold" fill="#A78BFA" text-anchor="middle">macOS</text>
  <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="1000" y="68" font-size="15" font-weight="bold" fill="#A78BFA" text-anchor="middle">Linux</text>

  <!-- Windows column box -->
  <g id="col-windows">
    <rect x="30" y="82" width="340" height="260" rx="10" fill="url(#col-grad)" stroke="#7C3AED" stroke-width="1.5"/>
    <!-- ALAS Root -->
    <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="200" y="102" font-size="10" fill="#A78BFA" text-anchor="middle">ALAS 根目录</text>
    <text font-family='ui-monospace, Menlo, monospace' x="200" y="119" font-size="10" fill="#D1D5DB" text-anchor="middle">AzurLaneAutoScript</text>
    <line x1="50" y1="130" x2="350" y2="130" stroke="#1F2937" stroke-width="0.5"/>
    <!-- Launcher -->
    <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="200" y="147" font-size="10" fill="#A78BFA" text-anchor="middle">启动器</text>
    <text font-family='ui-monospace, Menlo, monospace' x="200" y="164" font-size="10" fill="#D1D5DB" text-anchor="middle">alas-launcher.exe</text>
    <line x1="50" y1="175" x2="350" y2="175" stroke="#1F2937" stroke-width="0.5"/>
    <!-- Python -->
    <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="200" y="192" font-size="10" fill="#A78BFA" text-anchor="middle">Python</text>
    <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="200" y="209" font-size="10" fill="#D1D5DB" text-anchor="middle">toolkit（类 venv 结构）</text>
    <line x1="50" y1="220" x2="350" y2="220" stroke="#1F2937" stroke-width="0.5"/>
    <!-- Git -->
    <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="200" y="237" font-size="10" fill="#A78BFA" text-anchor="middle">Git</text>
    <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="200" y="254" font-size="10" fill="#D1D5DB" text-anchor="middle">toolkit/git（MinGit 解压）</text>
    <line x1="50" y1="265" x2="350" y2="265" stroke="#1F2937" stroke-width="0.5"/>
    <!-- Adb -->
    <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="200" y="282" font-size="10" fill="#A78BFA" text-anchor="middle">Adb</text>
    <text font-family='ui-monospace, Menlo, monospace' x="200" y="299" font-size="10" fill="#D1D5DB" text-anchor="middle">toolkit/adb.exe</text>
  </g>

  <!-- macOS column box -->
  <g id="col-macos">
    <rect x="430" y="82" width="340" height="260" rx="10" fill="url(#col-grad)" stroke="#7C3AED" stroke-width="1.5"/>
    <!-- ALAS Root -->
    <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="600" y="102" font-size="10" fill="#A78BFA" text-anchor="middle">ALAS 根目录</text>
    <text font-family='ui-monospace, Menlo, monospace' x="600" y="119" font-size="9" fill="#D1D5DB" text-anchor="middle">AzurLaneAutoScript.app/Contents/AzurLaneAutoScript</text>
    <line x1="450" y1="130" x2="750" y2="130" stroke="#1F2937" stroke-width="0.5"/>
    <!-- Launcher -->
    <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="600" y="147" font-size="10" fill="#A78BFA" text-anchor="middle">启动器</text>
    <text font-family='ui-monospace, Menlo, monospace' x="600" y="164" font-size="10" fill="#D1D5DB" text-anchor="middle">Contents/MacOS/alas-launcher</text>
    <line x1="450" y1="175" x2="750" y2="175" stroke="#1F2937" stroke-width="0.5"/>
    <!-- Python -->
    <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="600" y="192" font-size="10" fill="#A78BFA" text-anchor="middle">Python</text>
    <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="600" y="209" font-size="10" fill="#D1D5DB" text-anchor="middle">toolkit（类 venv 结构）</text>
    <line x1="450" y1="220" x2="750" y2="220" stroke="#1F2937" stroke-width="0.5"/>
    <!-- Git -->
    <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="600" y="237" font-size="10" fill="#A78BFA" text-anchor="middle">Git</text>
    <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="600" y="254" font-size="10" fill="#D1D5DB" text-anchor="middle">toolkit（Unix 目录结构）</text>
    <line x1="450" y1="265" x2="750" y2="265" stroke="#1F2937" stroke-width="0.5"/>
    <!-- Adb -->
    <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="600" y="282" font-size="10" fill="#A78BFA" text-anchor="middle">Adb</text>
    <text font-family='ui-monospace, Menlo, monospace' x="600" y="299" font-size="10" fill="#D1D5DB" text-anchor="middle">toolkit/bin/adb</text>
  </g>

  <!-- Linux column box -->
  <g id="col-linux">
    <rect x="830" y="82" width="340" height="260" rx="10" fill="url(#col-grad)" stroke="#7C3AED" stroke-width="1.5"/>
    <!-- ALAS Root -->
    <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="1000" y="102" font-size="10" fill="#A78BFA" text-anchor="middle">ALAS 根目录</text>
    <text font-family='ui-monospace, Menlo, monospace' x="1000" y="119" font-size="10" fill="#D1D5DB" text-anchor="middle">AzurLaneAutoScript</text>
    <line x1="850" y1="130" x2="1150" y2="130" stroke="#1F2937" stroke-width="0.5"/>
    <!-- Launcher -->
    <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="1000" y="147" font-size="10" fill="#A78BFA" text-anchor="middle">启动器</text>
    <text font-family='ui-monospace, Menlo, monospace' x="1000" y="164" font-size="10" fill="#D1D5DB" text-anchor="middle">alas-launcher</text>
    <line x1="850" y1="175" x2="1150" y2="175" stroke="#1F2937" stroke-width="0.5"/>
    <!-- Python -->
    <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="1000" y="192" font-size="10" fill="#A78BFA" text-anchor="middle">Python</text>
    <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="1000" y="209" font-size="10" fill="#D1D5DB" text-anchor="middle">toolkit（类 venv 结构）</text>
    <line x1="850" y1="220" x2="1150" y2="220" stroke="#1F2937" stroke-width="0.5"/>
    <!-- Git -->
    <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="1000" y="237" font-size="10" fill="#A78BFA" text-anchor="middle">Git</text>
    <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="1000" y="254" font-size="10" fill="#D1D5DB" text-anchor="middle">toolkit（Unix 目录结构）</text>
    <line x1="850" y1="265" x2="1150" y2="265" stroke="#1F2937" stroke-width="0.5"/>
    <!-- Adb -->
    <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="1000" y="282" font-size="10" fill="#A78BFA" text-anchor="middle">Adb</text>
    <text font-family='ui-monospace, Menlo, monospace' x="1000" y="299" font-size="10" fill="#D1D5DB" text-anchor="middle">toolkit/bin/adb</text>
  </g>

  <!-- ============ Environment PATH section ============ -->

  <!-- Section header -->
  <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="600" y="370" font-size="14" font-weight="bold" fill="#F3F4F6" text-anchor="middle">环境变量 PATH</text>
  <line x1="500" y1="380" x2="700" y2="380" stroke="url(#rail-grad)" stroke-width="1" opacity="0.4"/>

  <!-- Unix sub-box -->
  <g id="env-unix">
    <rect x="30" y="390" width="540" height="145" rx="10" fill="url(#col-grad)" stroke="#7C3AED" stroke-width="1" stroke-dasharray="4,3"/>
    <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="50" y="412" font-size="12" font-weight="bold" fill="#A78BFA">Unix (macOS · Linux)</text>
    <line x1="50" y1="420" x2="550" y2="420" stroke="#1F2937" stroke-width="0.5"/>
    <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="50" y="440" font-size="10" fill="#A78BFA">PATH</text>
    <text font-family='ui-monospace, Menlo, monospace' x="50" y="457" font-size="10" fill="#D1D5DB">toolkit/bin</text>
    <text font-family='ui-monospace, Menlo, monospace' x="50" y="474" font-size="10" fill="#D1D5DB">toolkit/libexec/git-core</text>
    <line x1="50" y1="488" x2="550" y2="488" stroke="#1F2937" stroke-width="0.5"/>
    <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="50" y="508" font-size="10" fill="#A78BFA">LD_LIBRARY_PATH</text>
    <text font-family='ui-monospace, Menlo, monospace' x="50" y="525" font-size="10" fill="#D1D5DB">toolkit/lib</text>
  </g>

  <!-- Windows sub-box -->
  <g id="env-windows">
    <rect x="630" y="390" width="540" height="145" rx="10" fill="url(#col-grad)" stroke="#7C3AED" stroke-width="1" stroke-dasharray="4,3"/>
    <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="650" y="412" font-size="12" font-weight="bold" fill="#A78BFA">Windows</text>
    <line x1="650" y1="420" x2="1150" y2="420" stroke="#1F2937" stroke-width="0.5"/>
    <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="650" y="440" font-size="10" fill="#A78BFA">PATH</text>
    <text font-family='ui-monospace, Menlo, monospace' x="650" y="457" font-size="10" fill="#D1D5DB">toolkit</text>
    <text font-family='ui-monospace, Menlo, monospace' x="650" y="474" font-size="10" fill="#D1D5DB">toolkit/Scripts</text>
    <text font-family='ui-monospace, Menlo, monospace' x="650" y="491" font-size="10" fill="#D1D5DB">toolkit/git/cmd</text>
    <line x1="650" y1="505" x2="1150" y2="505" stroke="#1F2937" stroke-width="0.5"/>
    <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="650" y="525" font-size="10" fill="#4B5563" font-style="italic">Windows 无 LD_LIBRARY_PATH</text>
  </g>

  <!-- Footer -->
  <text font-family='system-ui, -apple-system, "PingFang SC", sans-serif' x="600" y="548" font-size="10" fill="#4B5563" text-anchor="middle">基于 Tauri · Rust 构建</text>
</svg>
