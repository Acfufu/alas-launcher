<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">ALAS Launcher — 全平台原生 ALAS 启动器</title>
  <desc id="desc">为 AzurLaneAutoScript 打造的新型启动器：Windows、macOS Apple Silicon、Linux 原生运行，基于 Rust 与 Tauri。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081B30"/>
      <stop offset="0.55" stop-color="#0C2440"/>
      <stop offset="1" stop-color="#143152"/>
    </linearGradient>
    <linearGradient id="chipg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B3A5F"/>
      <stop offset="1" stop-color="#132C4A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4CC9F0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4CC9F0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="420" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="418" rx="25" fill="none" stroke="#2E5A8A" stroke-opacity="0.55" stroke-width="2"/>

  <!-- 雷达装饰（右侧） -->
  <g id="radar">
    <circle cx="1000" cy="206" r="150" fill="url(#glow)"/>
    <g fill="none" stroke="#4CC9F0" stroke-opacity="0.28">
      <circle cx="1000" cy="206" r="58"/>
      <circle cx="1000" cy="206" r="104"/>
      <circle cx="1000" cy="206" r="150"/>
      <line x1="850" y1="206" x2="1150" y2="206"/>
      <line x1="1000" y1="56" x2="1000" y2="356"/>
    </g>
    <line x1="1000" y1="206" x2="1130" y2="118" stroke="#4CC9F0" stroke-width="3" stroke-linecap="round"/>
    <circle cx="1130" cy="118" r="7" fill="#4CC9F0"/>
    <circle cx="920" cy="280" r="5" fill="#F0B429"/>
  </g>

  <!-- 锚徽标（左侧） -->
  <g id="anchor">
    <g transform="translate(96,128)" fill="none" stroke="#4CC9F0" stroke-width="7" stroke-linecap="round">
      <circle cx="28" cy="8" r="8"/>
      <line x1="28" y1="16" x2="28" y2="82"/>
      <path d="M28 82 Q28 112 0 112 M28 82 Q28 112 56 112"/>
      <path d="M6 98 Q28 120 50 98"/>
      <line x1="10" y1="34" x2="46" y2="34"/>
    </g>
    <circle cx="124" cy="128" r="4" fill="#F0B429"/>
  </g>

  <!-- 标题 -->
  <g id="title-block">
    <text x="140" y="136" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="64" font-weight="700" fill="#F5F9FF" letter-spacing="1">ALAS Launcher</text>
    <rect x="142" y="158" width="218" height="5" rx="2.5" fill="#4CC9F0"/>
  </g>

  <!-- 技术徽章 -->
  <g id="pills">
    <rect x="142" y="182" width="86" height="30" rx="15" fill="#122B49" stroke="#2E5A8A" stroke-opacity="0.8"/>
    <text x="185" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#8FC7E8" text-anchor="middle">Rust</text>
    <rect x="240" y="182" width="96" height="30" rx="15" fill="#122B49" stroke="#2E5A8A" stroke-opacity="0.8"/>
    <text x="288" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#8FC7E8" text-anchor="middle">Tauri 2</text>
    <rect x="348" y="182" width="122" height="30" rx="15" fill="#122B49" stroke="#2E5A8A" stroke-opacity="0.8"/>
    <text x="409" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#8FC7E8" text-anchor="middle">GPLv3</text>
  </g>

  <!-- 描述 -->
  <g id="desc-block">
    <text x="140" y="252" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="26" fill="#C9DDF2">为 <tspan fill="#7FD4F2">AzurLaneAutoScript</tspan> 打造的全平台原生启动器：</text>
    <text x="140" y="290" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="26" fill="#C9DDF2">在 Apple Silicon 上无需转译、无需 Docker，解压即玩。</text>
  </g>

  <!-- 平台卡片 -->
  <g id="chip-win">
    <rect x="140" y="322" width="200" height="56" rx="14" fill="url(#chipg)" stroke="#2E5A8A" stroke-opacity="0.9"/>
    <text x="240" y="356" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="#F0F6FD" text-anchor="middle">Windows</text>
  </g>
  <g id="chip-mac">
    <rect x="360" y="322" width="220" height="56" rx="14" fill="url(#chipg)" stroke="#2E5A8A" stroke-opacity="0.9"/>
    <text x="470" y="356" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="21" font-weight="600" fill="#F0F6FD" text-anchor="middle">macOS · 原生</text>
  </g>
  <g id="chip-linux">
    <rect x="600" y="322" width="200" height="56" rx="14" fill="url(#chipg)" stroke="#2E5A8A" stroke-opacity="0.9"/>
    <text x="700" y="356" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="#F0F6FD" text-anchor="middle">Linux</text>
  </g>

  <!-- 底部元信息 -->
  <g id="meta">
    <text x="140" y="402" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="18" fill="#6E8FB0">单实例 · 仅更新 Repo · 绿色版 Python · 重复启动只聚焦已有窗口</text>
  </g>
</svg>
