<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Launch Flow</title>
  <desc id="desc">ALAS Launcher launch flow: prepare the environment, update the ALAS repository, start the local Web service, and open the Web UI at 127.0.0.1:22267.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081B30" />
      <stop offset="1" stop-color="#143152" />
    </linearGradient>
    <linearGradient id="stepg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B3A5F" />
      <stop offset="1" stop-color="#122A48" />
    </linearGradient>
  </defs>

  <rect width="1200" height="460" rx="26" fill="url(#bg)" />
  <rect x="1" y="1" width="1198" height="458" rx="25" fill="none" stroke="#2E5A8A" stroke-opacity="0.55" stroke-width="2" />

  <text x="96" y="84" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="38" font-weight="700" fill="#F5F9FF">Launch Flow</text>
  <rect x="98" y="102" width="120" height="4" rx="2" fill="#4CC9F0" />

  <g id="step-1" opacity="1" transform="translate(0,0)">
    <rect x="96" y="150" width="190" height="180" rx="16" fill="url(#stepg)" stroke="#4CC9F0" stroke-opacity="0.9" />
    <circle cx="137" cy="196" r="22" fill="#0E2440" stroke="#4CC9F0" stroke-width="2" />
    <text x="137" y="204" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#7FD4F2" text-anchor="middle">1</text>
    <text x="118" y="244" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#F0F6FD">Env Ready</text>
    <text x="118" y="278" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#9FB8D4">Inject PATH and</text>
    <text x="118" y="302" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#9FB8D4">read WebuiPort (22267)</text>
  </g>
  <g id="arrow-1" opacity="1">
    <path d="M296 240 l13 0 m0 0 l-6 -7 m6 7 l-6 7" stroke="#4CC9F0" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>
  <g id="step-2" opacity="1" transform="translate(0,0)">
    <rect x="315" y="150" width="190" height="180" rx="16" fill="url(#stepg)" stroke="#4CC9F0" stroke-opacity="0.9" />
    <circle cx="356" cy="196" r="22" fill="#0E2440" stroke="#4CC9F0" stroke-width="2" />
    <text x="356" y="204" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#7FD4F2" text-anchor="middle">2</text>
    <text x="337" y="244" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#F0F6FD">Repo Updated</text>
    <text x="337" y="278" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#9FB8D4">Clean config,</text>
    <text x="337" y="302" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#9FB8D4">pull latest ALAS</text>
  </g>
  <g id="arrow-2" opacity="1">
    <path d="M515 240 l13 0 m0 0 l-6 -7 m6 7 l-6 7" stroke="#4CC9F0" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>
  <g id="step-3" opacity="1" transform="translate(0,0)">
    <rect x="534" y="150" width="190" height="180" rx="16" fill="url(#stepg)" stroke="#4CC9F0" stroke-opacity="0.9" />
    <circle cx="575" cy="196" r="22" fill="#0E2440" stroke="#4CC9F0" stroke-width="2" />
    <text x="575" y="204" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#7FD4F2" text-anchor="middle">3</text>
    <text x="556" y="244" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#F0F6FD">Web UI Started</text>
    <text x="556" y="278" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#9FB8D4">gui.py --host</text>
    <text x="556" y="302" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#9FB8D4">127.0.0.1 --port</text>
  </g>
  <g id="arrow-3" opacity="1">
    <path d="M734 240 l13 0 m0 0 l-6 -7 m6 7 l-6 7" stroke="#4CC9F0" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>
  <g id="step-4" opacity="1" transform="translate(0,0)">
    <rect x="753" y="150" width="190" height="180" rx="16" fill="url(#stepg)" stroke="#F0B429" stroke-opacity="0.9" />
    <circle cx="794" cy="196" r="22" fill="#0E2440" stroke="#F0B429" stroke-width="2" />
    <text x="794" y="204" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#F7D488" text-anchor="middle">4</text>
    <text x="775" y="244" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#F0F6FD">Ready</text>
    <text x="775" y="278" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#9FB8D4">WebView opens</text>
    <text x="775" y="302" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#9FB8D4">local ALAS Web UI</text>
  </g>
  <rect x="96" y="366" width="1008" height="58" rx="12" fill="#060D18" stroke="#2E5A8A" stroke-opacity="0.8" />
  <text x="120" y="399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8FC7E8">$ gui.py --host 127.0.0.1 --port 22267</text>
  <text x="880" y="399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7FD4F2">Ready</text>
  <circle cx="1086" cy="395" r="5" fill="#6FDFA8" />
</svg>